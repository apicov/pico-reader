[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-core"
version = "0.1.0"
description = "Pico Reader's code shared by the server (backend/) and the desktop tool (tools/)"
requires-python = ">=3.12"
# the versions are pinned in backend/requirements.txt and tools/requirements.txt
dependencies = ["numpy", "onnxruntime", "tokenizers", "pymupdf", "beautifulsoup4"]

[tool.setuptools]
packages = ["pico_core"]
