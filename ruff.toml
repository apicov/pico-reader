# Lint for the Python parts (backend/, tools/, e2e/): `ruff check .` from the repository root
line-length = 140
target-version = "py312"
extend-exclude = ["**/.venv", "backend/alembic/versions"]

[lint]
# pyflakes and pycodestyle, plus: imports sorted, bugbear, pyupgrade, simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "B008",   # FastAPI's Depends()/Query() in defaults is how it works
  "E731",   # a short lambda with a name reads fine
  "UP047",  # TypeVar generics are fine
]

[lint.per-file-ignores]
# pytest: fixtures are imported into the test modules that use them; conftest sets the environment before importing
"**/tests/**" = ["F811", "E402", "E501"]  # test data lines may be long

[lint.isort]
known-first-party = ["app", "readertool", "tests"]
