# The web app (built frontend) + its API (uvicorn :8030)
<VirtualHost *:443>
    ServerName books.apicov.xyz
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/books.apicov.xyz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/books.apicov.xyz/privkey.pem

    DocumentRoot /var/www/pico-reader
    <Directory /var/www/pico-reader>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # The service worker and the page must never be cached, or a new build never arrives
        <FilesMatch "^(index\.html|sw\.js|manifest\.webmanifest)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </Directory>
    <Directory /var/www/pico-reader/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    <Location /api>
        ProxyPass http://127.0.0.1:8030/api
        ProxyPassReverse http://127.0.0.1:8030/api
        RequestHeader set X-Forwarded-Proto "https"
    </Location>
    <Location /health>
        ProxyPass http://127.0.0.1:8030/health
    </Location>

    ErrorLog logs/books-error.log
    CustomLog logs/books-access.log combined
</VirtualHost>
